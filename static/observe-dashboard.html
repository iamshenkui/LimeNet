<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LimeNet Observe</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --panel: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #d9dee5;
      --accent: #2f7d68;
      --warn: #a16207;
      --risk: #b42318;
      --done: #2f7d68;
      --active: #2563eb;
      --pending: #b7791f;
      --blocked: #b42318;
      --mono: "SFMono-Regular", "Cascadia Code", "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button {
      min-height: 36px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .shell {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      padding: 14px 0 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 720;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .mono { font-family: var(--mono); }
    .statusline {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 13px;
    }
    .runs {
      display: grid;
      gap: 28px;
    }
    .run {
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }
    .run-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 14px;
    }
    .run-title {
      display: flex;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .run-title h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
      background: #fafafa;
    }
    .counts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .count {
      display: grid;
      grid-template-columns: auto auto;
      gap: 8px;
      align-items: center;
      min-height: 30px;
      padding: 0 9px;
      border-left: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 12px;
    }
    .count b { color: var(--ink); }
    .run-body {
      display: grid;
      gap: 14px;
      align-items: start;
    }
    .milestone-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .milestone-card {
      position: relative;
      min-height: 154px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: left;
      cursor: pointer;
    }
    .milestone-card:hover {
      border-color: #aeb8c3;
      box-shadow: 0 10px 24px rgba(24, 24, 27, 0.06);
    }
    .milestone-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .milestone-id {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
    .milestone-title {
      font-size: 15px;
      line-height: 1.3;
      font-weight: 720;
    }
    .milestone-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .progress {
      height: 8px;
      border-radius: 999px;
      background: #eceff3;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--done);
    }
    .task-section {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      scroll-margin-top: 18px;
    }
    .task-section-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }
    .task-section h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }
    .tree-panel {
      display: grid;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .task-tree {
      display: grid;
      gap: 10px;
    }
    .tree-node {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfc;
      overflow: hidden;
    }
    .tree-node[open] {
      background: var(--panel);
    }
    .tree-summary {
      min-height: 64px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      cursor: pointer;
    }
    .tree-summary::-webkit-details-marker { display: none; }
    .tree-title {
      display: grid;
      gap: 5px;
      min-width: 0;
    }
    .tree-title strong {
      font-size: 14px;
      line-height: 1.3;
    }
    .tree-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tree-children {
      display: grid;
      gap: 10px;
      padding: 0 12px 12px 28px;
      border-top: 1px solid var(--line);
    }
    .tree-leaf {
      margin-left: 28px;
    }
    .main-track {
      display: grid;
      gap: 14px;
      min-width: 0;
    }
    .relationship-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      overflow: hidden;
    }
    .relationship-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }
    .relationship-caption {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .relationship-root {
      display: grid;
      gap: 5px;
      padding: 12px;
      border: 1px solid rgba(47, 125, 104, 0.34);
      border-radius: 8px;
      background: #f4faf7;
      margin-bottom: 12px;
    }
    .relationship-root .task-id,
    .relationship-row .task-id {
      min-width: auto;
    }
    .relationship-tree {
      position: relative;
      display: grid;
      gap: 8px;
      padding-left: 20px;
    }
    .relationship-tree::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 8px;
      border-left: 1px solid var(--line);
    }
    .relationship-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(180px, 0.55fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      padding: 10px 12px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfc;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }
    .relationship-row::before {
      content: "";
      position: absolute;
      top: 50%;
      left: -13px;
      width: 13px;
      border-top: 1px solid var(--line);
    }
    .relationship-row:hover {
      border-color: #aeb8c3;
      box-shadow: 0 8px 18px rgba(24, 24, 27, 0.05);
      transform: translateY(-1px);
    }
    .relationship-main {
      display: grid;
      gap: 5px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }
    .relationship-title {
      font-size: 13px;
      line-height: 1.35;
      font-weight: 680;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .dependency-cell {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }
    .dependency-label {
      width: 100%;
      color: var(--muted);
      font-size: 11px;
    }
    .dependency-chip {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-height: 22px;
      padding: 0 7px;
      border-radius: 6px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #fff;
      font-family: var(--mono);
      font-size: 11px;
      text-decoration: none;
    }
    .dependency-chip.known {
      color: var(--accent);
      border-color: rgba(47, 125, 104, 0.28);
      background: #f6faf8;
    }
    .relationship-status {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      color: var(--muted);
      white-space: nowrap;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--pending);
    }
    .status-dot.COMPLETED { background: var(--done); }
    .status-dot.IN_PROGRESS,
    .status-dot.EVALUATING { background: var(--active); }
    .status-dot.UNKNOWN,
    .status-dot.MISSING,
    .status-dot.BACKOFF { background: var(--blocked); }
    .relationship-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .task-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .task-card {
      position: relative;
      min-height: 148px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 13px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
      color: inherit;
      text-decoration: none;
    }
    .task-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      border-radius: 8px 0 0 8px;
      background: var(--pending);
    }
    .task-card.status-PENDING,
    .task-card.status-READY {
      border-color: rgba(183, 121, 31, 0.38);
      background: #fffbeb;
    }
    .task-card.status-IN_PROGRESS,
    .task-card.status-EVALUATING {
      border-color: rgba(37, 99, 235, 0.38);
      background: #eff6ff;
    }
    .task-card.status-IN_PROGRESS::before,
    .task-card.status-EVALUATING::before {
      background: var(--active);
    }
    .task-card.status-COMPLETED {
      border-color: rgba(47, 125, 104, 0.38);
      background: #f6faf8;
    }
    .task-card.status-COMPLETED::before {
      background: var(--done);
    }
    .task-card.status-BACKOFF::before,
    .task-card.status-UNKNOWN::before,
    .task-card.status-MISSING::before { background: var(--blocked); }
    .task-card.status-BACKOFF,
    .task-card.status-UNKNOWN,
    .task-card.status-MISSING {
      border-color: rgba(180, 35, 24, 0.38);
      background: #fff5f5;
    }
    .task-card:hover {
      border-color: #aeb8c3;
      box-shadow: 0 10px 24px rgba(24, 24, 27, 0.06);
      transform: translateY(-1px);
    }
    .task-card:active { transform: translateY(0); }
    .task-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .task-id {
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }
    .task-title {
      min-height: 42px;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 680;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .task-foot {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      color: var(--muted);
      font-size: 12px;
    }
    .task-facts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--pending);
      white-space: nowrap;
    }
    .status.COMPLETED { color: var(--done); }
    .status.IN_PROGRESS, .status.EVALUATING { color: var(--active); }
    .status.UNKNOWN, .status.MISSING, .status.BACKOFF { color: var(--blocked); }
    .truncate {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .run-footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }
    .side {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }
    .signals, .events {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }
    .section-title {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      font-family: var(--mono);
    }
    .signal, .event {
      border-top: 1px solid var(--line);
      padding-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .signal b { color: var(--warn); font-family: var(--mono); }
    .page-head {
      display: grid;
      gap: 10px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }
    .breadcrumbs a {
      color: var(--accent);
      text-decoration: none;
    }
    .page-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.45fr);
      gap: 12px;
      align-items: start;
    }
    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(720px, 100%);
      background: var(--panel);
      border-left: 1px solid var(--line);
      box-shadow: -16px 0 40px rgba(24, 24, 27, 0.08);
      transform: translateX(102%);
      transition: transform 180ms ease;
      z-index: 20;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    .drawer-body {
      overflow: auto;
      padding: 16px;
    }
    pre {
      overflow: auto;
      background: #f4f5f6;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
    }
    .kv {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 8px 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .kv div:nth-child(odd) { color: var(--muted); }
    .empty, .error {
      padding: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      color: var(--muted);
    }
    .error { color: var(--risk); }

    @media (max-width: 900px) {
      .shell { width: min(100% - 20px, 1480px); padding-top: 12px; }
      .topbar, .run-head, .run-footer { grid-template-columns: 1fr; }
      .statusline, .counts { justify-content: flex-start; }
      .milestone-grid { grid-template-columns: 1fr; }
      .task-section-head { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .tree-summary { grid-template-columns: 1fr; }
      .tree-actions { justify-content: flex-start; }
      .tree-children { padding-left: 12px; }
      .tree-leaf { margin-left: 0; }
      .task-grid { grid-template-columns: 1fr; }
      .relationship-header { grid-template-columns: 1fr; }
      .relationship-row { grid-template-columns: 1fr; align-items: start; }
      .relationship-status { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>LimeNet Observe</h1>
        <div id="instance-meta" class="meta"></div>
      </div>
      <div class="statusline">
        <span id="refresh-state">loading</span>
        <button id="refresh-button" type="button">Refresh</button>
      </div>
    </section>
    <section id="content" class="runs"></section>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <div id="drawer-title" class="truncate"></div>
        <div id="drawer-subtitle" class="meta"></div>
      </div>
      <button id="drawer-close" type="button">Close</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <script>
    const content = document.getElementById("content");
    const instanceMeta = document.getElementById("instance-meta");
    const refreshState = document.getElementById("refresh-state");
    const drawer = document.getElementById("drawer");
    const drawerTitle = document.getElementById("drawer-title");
    const drawerSubtitle = document.getElementById("drawer-subtitle");
    const drawerBody = document.getElementById("drawer-body");
    let isLoading = false;
    let state = { runs: [], snapshots: new Map(), instance: {} };

    document.getElementById("refresh-button").addEventListener("click", load);
    document.getElementById("drawer-close").addEventListener("click", closeDrawer);
    window.addEventListener("hashchange", renderRoute);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[char]));
    }

    function fmtTime(value) {
      if (!value) return "";
      return new Date(value).toLocaleString();
    }

    async function fetchJson(url) {
      const response = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    async function load() {
      if (isLoading) return;
      isLoading = true;
      refreshState.textContent = "refreshing";
      try {
        const snapshot = await fetchJson("/status.json");
        state.instance = snapshot.instance || {};
        state.runs = snapshot.runs || [];
        state.snapshots = new Map();
        const snapshots = await Promise.all(state.runs.map((run) => fetchJson(`/runs/${run.run_id}/snapshot.json`).catch((error) => ({ error, run }))));
        for (const item of snapshots) {
          if (!item.error) state.snapshots.set(item.run.run_id, indexSnapshot(item));
        }
        renderInstance(snapshot);
        renderRoute();
        refreshState.textContent = `updated ${fmtTime(snapshot.observed_at)}`;
      } catch (error) {
        content.innerHTML = `<div class="error">Unable to load observe snapshot: ${escapeHtml(error.message)}</div>`;
        refreshState.textContent = "error";
      } finally {
        isLoading = false;
      }
    }

    function renderInstance(snapshot) {
      const instance = snapshot.instance || {};
      instanceMeta.innerHTML = [
        ["instance", instance.instance_id],
        ["task", instance.task_api_address],
        ["status", instance.status_api_address],
        ["dashboard", instance.dashboard_address],
        ["database", instance.database_target]
      ].map(([label, value]) => `<span><b>${label}</b> <span class="mono">${escapeHtml(value)}</span></span>`).join("");
    }

    function indexSnapshot(snapshot) {
      const byId = new Map();
      const children = new Map();
      for (const task of snapshot.tasks || []) {
        byId.set(task.task_id, task);
      }
      for (const task of snapshot.tasks || []) {
        const parentId = task.raw_task?.parent_task_id;
        const key = parentId && byId.has(parentId) ? parentId : "__root__";
        if (!children.has(key)) children.set(key, []);
        children.get(key).push(task);
      }
      for (const list of children.values()) list.sort(compareTasks);
      return { ...snapshot, byId, children, rollups: new Map() };
    }

    function compareTasks(a, b) {
      return (a.task_order ?? 0) - (b.task_order ?? 0)
        || String(a.task_id).localeCompare(String(b.task_id));
    }

    function parseRoute() {
      const hash = window.location.hash || "";
      const match = hash.match(/^#\/runs\/([^/]+)(?:\/tasks\/(.+))?$/);
      if (!match) return {};
      return {
        runId: decodeURIComponent(match[1]),
        taskId: match[2] ? decodeURIComponent(match[2]) : null
      };
    }

    function routeFor(runId, taskId = null) {
      return taskId
        ? `#/runs/${encodeURIComponent(runId)}/tasks/${encodeURIComponent(taskId)}`
        : `#/runs/${encodeURIComponent(runId)}`;
    }

    function renderRoute() {
      if (!state.runs.length) {
        content.innerHTML = `<div class="empty">No runs observed.</div>`;
        return;
      }

      const route = parseRoute();
      if (!route.runId) {
        renderRunIndex();
        return;
      }

      const snapshot = state.snapshots.get(route.runId);
      if (!snapshot) {
        content.innerHTML = `<div class="error">Run not found: ${escapeHtml(route.runId)}</div>`;
        return;
      }

      renderTaskPage(snapshot, route.taskId);
    }

    function renderRunIndex() {
      const cards = state.runs.map((run) => {
        return `
          <article class="run">
            <header class="run-head">
              <div>
                <div class="run-title">
                  <h2>${escapeHtml(run.display_name || run.source_ref || run.run_id)}</h2>
                  <span class="pill">${escapeHtml(run.source_kind)}</span>
                  <span class="pill">${escapeHtml(run.status)}</span>
                </div>
                <div class="meta">
                  <span>${escapeHtml(run.source_ref || "No source reference")}</span>
                  <span>activity ${escapeHtml(fmtTime(run.last_activity_at))}</span>
                </div>
              </div>
              <a class="pill" href="${escapeHtml(routeFor(run.run_id))}">Open</a>
            </header>
          </article>
        `;
      }).join("");
      content.innerHTML = cards;
    }

    function renderTaskPage(snapshot, taskId) {
      const run = snapshot.run;
      const current = taskId ? snapshot.byId.get(taskId) : null;
      if (taskId && !current) {
        content.innerHTML = `<div class="error">Task not found: ${escapeHtml(taskId)}</div>`;
        return;
      }

      const children = snapshot.children.get(taskId || "__root__") || [];
      const title = current
        ? current.title || current.task_id
        : run.display_name || run.source_ref || run.run_id;
      const crumbs = renderBreadcrumbs(snapshot, current);
      const summary = current ? renderTaskSummary(snapshot, current) : renderRunSummary(run);
      const body = children.length
        ? renderChildList(snapshot, children)
        : renderLeafDetail(current);

      content.innerHTML = `
        <article class="run">
          <section class="page-head">
            ${crumbs}
            <h2 class="page-title">${escapeHtml(title)}</h2>
            ${summary}
          </section>
          <div class="run-body">${body}</div>
        </article>
      `;
    }

    function renderBreadcrumbs(snapshot, current) {
      const links = [`<a href="#">Runs</a>`, `<a href="${escapeHtml(routeFor(snapshot.run.run_id))}">${escapeHtml(snapshot.run.display_name || snapshot.run.run_id)}</a>`];
      if (current) {
        for (const parent of ancestors(snapshot, current)) {
          links.push(`<a href="${escapeHtml(routeFor(snapshot.run.run_id, parent.task_id))}">${escapeHtml(parent.task_id)}</a>`);
        }
        links.push(`<span>${escapeHtml(current.task_id)}</span>`);
      }
      return `<nav class="breadcrumbs">${links.join("<span>/</span>")}</nav>`;
    }

    function ancestors(snapshot, task) {
      const result = [];
      let parentId = task.raw_task?.parent_task_id;
      const seen = new Set([task.task_id]);
      while (parentId && snapshot.byId.has(parentId) && !seen.has(parentId)) {
        const parent = snapshot.byId.get(parentId);
        result.unshift(parent);
        seen.add(parentId);
        parentId = parent.raw_task?.parent_task_id;
      }
      return result;
    }

    function renderRunSummary(run) {
      return `
        <div class="meta">
          <span>${escapeHtml(run.source_ref || "")}</span>
          <span>activity ${escapeHtml(fmtTime(run.last_activity_at))}</span>
        </div>
      `;
    }

    function renderTaskSummary(snapshot, task) {
      const children = snapshot.children.get(task.task_id) || [];
      const rollup = summarizeSubtree(snapshot, task);
      return `
        <div class="meta">
          <span class="mono">${escapeHtml(task.task_id)}</span>
          <span class="status ${escapeHtml(task.status.normalized)}">${escapeHtml(task.status.normalized)}</span>
          <span>${escapeHtml(children.length)} direct children</span>
          <span>${escapeHtml(rollup.total - 1)} descendants</span>
          <span>${escapeHtml(rollup.percent)}% complete</span>
        </div>
      `;
    }

    function summarizeSubtree(snapshot, task) {
      if (snapshot.rollups?.has(task.task_id)) return snapshot.rollups.get(task.task_id);
      return computeRollup(snapshot, task, new Set());
    }

    function computeRollup(snapshot, task, seen) {
      if (snapshot.rollups?.has(task.task_id)) return snapshot.rollups.get(task.task_id);
      if (seen.has(task.task_id)) return { counts: {}, total: 0, completed: 0, percent: 0 };

      const nextSeen = new Set(seen);
      nextSeen.add(task.task_id);
      const counts = {};
      let total = 1;
      let completed = 0;
      const status = task.status?.normalized || "MISSING";
      counts[status] = 1;
      if (status === "COMPLETED") completed = 1;

      for (const child of snapshot.children.get(task.task_id) || []) {
        const childRollup = computeRollup(snapshot, child, nextSeen);
        total += childRollup.total;
        completed += childRollup.completed;
        for (const [childStatus, count] of Object.entries(childRollup.counts)) {
          counts[childStatus] = (counts[childStatus] || 0) + count;
        }
      }

      const rollup = { counts, total, completed, percent: total ? Math.round((completed / total) * 100) : 0 };
      snapshot.rollups?.set(task.task_id, rollup);
      return rollup;
    }

    function renderChildList(snapshot, children) {
      const cards = children.map((task) => renderTaskCard(snapshot, task)).join("");
      return `
        <section class="main-track">
          ${renderLocalGraph(snapshot, children)}
          <p class="section-title">Tasks At This Level</p>
          <div class="task-grid">${cards}</div>
        </section>
      `;
    }

    function renderTaskCard(snapshot, task) {
      const childCount = (snapshot.children.get(task.task_id) || []).length;
      const rollup = summarizeSubtree(snapshot, task);
      return `
        <a class="task-card status-${escapeHtml(task.status.normalized)}" href="${escapeHtml(routeFor(snapshot.run.run_id, task.task_id))}">
          <div class="task-top">
            <div class="task-id mono truncate">${escapeHtml(task.task_id)}</div>
            <span class="status ${escapeHtml(task.status.normalized)}">${escapeHtml(task.status.normalized)}</span>
          </div>
          <div class="task-title">${escapeHtml(task.title || task.task_id)}</div>
          <div class="task-foot">
            <div class="task-facts">
              <span class="pill">${escapeHtml(childCount)} children</span>
              <span class="pill">${escapeHtml(rollup.total - 1)} descendants</span>
              <span class="pill">${escapeHtml(rollup.percent)}%</span>
              ${task.is_next_pending ? `<span class="pill">next</span>` : ""}
            </div>
            <span class="mono truncate">${escapeHtml(fmtTime(task.updated_at))}</span>
          </div>
        </a>
      `;
    }

    function renderLeafDetail(task) {
      if (!task) return `<div class="empty">No task selected.</div>`;
      const raw = task.raw_task || {};
      const acceptance = (raw.acceptance_criteria || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
      const guidance = (raw.split_guidance || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
      return `
        <section class="detail-grid">
          <div class="side">
            <p class="section-title">Task Detail</p>
            <div class="kv">
              <div>Status</div><div class="mono">${escapeHtml(task.status.normalized)} ${task.status.raw ? `(${escapeHtml(task.status.raw)})` : ""}</div>
              <div>Updated</div><div>${escapeHtml(fmtTime(task.updated_at))}</div>
              <div>Dependencies</div><div class="mono">${escapeHtml(task.dependencies.join(", ") || "none")}</div>
              <div>Dependencies complete</div><div>${task.dependencies_complete ? "yes" : "no"}</div>
              <div>Next pending</div><div>${task.is_next_pending ? "yes" : "no"}</div>
              <div>Source</div><div class="mono">${escapeHtml(raw.source_ref || "")}</div>
              <div>Scope</div><div>${escapeHtml(raw.module_scope || "")}</div>
              <div>Complexity</div><div>${escapeHtml(raw.complexity || "")}</div>
              <div>Risk</div><div>${escapeHtml(raw.risk || "")}</div>
            </div>
            <p>${escapeHtml(raw.description || "")}</p>
            ${acceptance ? `<p class="section-title">Acceptance Criteria</p><ul>${acceptance}</ul>` : ""}
            ${guidance ? `<p class="section-title">Split Guidance</p><ul>${guidance}</ul>` : ""}
          </div>
          <div class="side">
            <p class="section-title">Raw task JSON</p>
            <pre>${escapeHtml(JSON.stringify(raw, null, 2))}</pre>
          </div>
        </section>
      `;
    }

    function renderLocalGraph(snapshot, children) {
      if (!children.length) return "";
      const route = parseRoute();
      const current = route.taskId ? snapshot.byId.get(route.taskId) : null;
      const currentTitle = current
        ? current.title || current.task_id
        : snapshot.run.display_name || snapshot.run.source_ref || snapshot.run.run_id;
      const currentId = current ? current.task_id : "Run root";
      const dependencyCount = children.reduce((total, task) => total + (task.dependencies || []).length, 0);
      const levelLabel = current ? "Direct children" : "Root tasks";
      const levelTaskIds = new Set(children.map((task) => task.task_id));
      return `
        <section class="relationship-panel">
          <div class="relationship-header">
            <div>
              <p class="section-title">Task Tree</p>
              <div class="relationship-caption">${escapeHtml(levelLabel)} for the current page. Open any child to move one level deeper.</div>
            </div>
            <span class="pill">${escapeHtml(children.length)} nodes · ${escapeHtml(dependencyCount)} dependencies</span>
          </div>
          <div class="relationship-root">
            <span class="task-id mono truncate">${escapeHtml(currentId)}</span>
            <strong>${escapeHtml(currentTitle)}</strong>
          </div>
          <div class="relationship-tree">${children.map((task) => renderRelationshipRow(snapshot, levelTaskIds, task)).join("")}</div>
          ${dependencyCount ? `<div class="relationship-note">Dependencies outside this level are marked as external so this view stays scoped to the current recursive page.</div>` : ""}
        </section>
      `;
    }

    function renderRelationshipRow(snapshot, levelTaskIds, task) {
      const childCount = (snapshot.children.get(task.task_id) || []).length;
      const deps = task.dependencies || [];
      const dependencyHtml = deps.length
        ? deps.map((id) => renderDependencyChip(snapshot, id, levelTaskIds)).join("")
        : `<span class="dependency-chip">none</span>`;
      return `
        <div class="relationship-row">
          <a class="relationship-main" href="${escapeHtml(routeFor(snapshot.run.run_id, task.task_id))}">
            <span class="task-id mono truncate">${escapeHtml(task.task_id)}</span>
            <span class="relationship-title">${escapeHtml(task.title || task.task_id)}</span>
          </a>
          <div class="dependency-cell">
            <span class="dependency-label">Depends on</span>
            ${dependencyHtml}
          </div>
          <div class="relationship-status">
            <span class="status-dot ${escapeHtml(task.status.normalized)}"></span>
            <span class="mono">${escapeHtml(task.status.normalized)}</span>
            <span>${escapeHtml(childCount)} children</span>
          </div>
        </div>
      `;
    }

    function renderDependencyChip(snapshot, dependencyId, levelTaskIds) {
      const known = snapshot.byId.has(dependencyId);
      const sameLevel = levelTaskIds.has(dependencyId);
      const label = sameLevel ? dependencyId : `${dependencyId} external`;
      if (!known) return `<span class="dependency-chip">${escapeHtml(label)}</span>`;
      return `<a class="dependency-chip known" href="${escapeHtml(routeFor(snapshot.run.run_id, dependencyId))}">${escapeHtml(label)}</a>`;
    }

    async function openTask(url) {
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      drawerTitle.textContent = "Loading task";
      drawerSubtitle.innerHTML = "";
      drawerBody.innerHTML = `<div class="empty">Loading task detail.</div>`;
      try {
        const snapshot = await fetchJson(url);
        const task = snapshot.task;
        drawerTitle.textContent = task.title || task.task_id;
        drawerSubtitle.innerHTML = `<span class="mono">${escapeHtml(task.run_id)}</span><span class="mono">${escapeHtml(task.task_id)}</span>`;
        drawerBody.innerHTML = `
          <div class="kv">
            <div>Status</div><div class="mono">${escapeHtml(task.status.normalized)} ${task.status.raw ? `(${escapeHtml(task.status.raw)})` : ""}</div>
            <div>Updated</div><div>${escapeHtml(fmtTime(task.updated_at))}</div>
            <div>Dependencies</div><div class="mono">${escapeHtml(task.dependencies.join(", ") || "none")}</div>
            <div>Dependencies complete</div><div>${task.dependencies_complete ? "yes" : "no"}</div>
            <div>Next pending</div><div>${task.is_next_pending ? "yes" : "no"}</div>
          </div>
          <p class="section-title">Raw task JSON</p>
          <pre>${escapeHtml(JSON.stringify(task.raw_task, null, 2))}</pre>
        `;
      } catch (error) {
        drawerBody.innerHTML = `<div class="error">Unable to load task: ${escapeHtml(error.message)}</div>`;
      }
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
